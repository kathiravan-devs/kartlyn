<!DOCTYPE html>
<html>

<head>
  <title>KartLyn Tracking</title>
  <link rel="icon" type="image/webp" href="images/Kartlyn-mobile.webp">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/shared/amazon-header.css">
  <link rel="stylesheet" href="styles/pages/tracking.css">
</head>

<body>
  <div class="kartlyn-header">
    <div class="kartlyn-header-left-section">
      <a href="index.html" class="header-link">
        <img class="kartlyn-logo" src="images/Kartlyn.PNG">
        <img class="kartlyn-mobile-logo" src="images/Kartlyn-mobile.webp">
      </a>
    </div>

    <div class="kartlyn-header-middle-section">
      <input class="search-bar" type="text" placeholder="Search KartLyn">
      <button class="search-button">
        <img class="search-icon" src="images/icons/search-icon.png">
      </button>
    </div>

    <div class="kartlyn-header-right-section">
      <a class="orders-link header-link" href="orders.html">
        <span class="returns-text">Returns</span>
        <span class="orders-text">& Orders</span>
      </a>
      <a class="cart-link header-link" href="checkout.html">
        <img class="cart-icon" src="images/icons/cart-icon.png">
        <div class="cart-quantity" id="js-cart-quantity">3</div>
        <div class="cart-text">Cart</div>
      </a>
    </div>

    <div class="mobile-right-section js-mobile-right-section">
      <img src="images/icons/hamburger-menu.png" alt="Menu" class="hamburger-menu">
    </div>
  </div>

  <div class="menu-dropdown">
    <a href="orders.html">Returns & Orders</a>
    <a href="checkout.html">Cart(<span class="js-cart-quantity-mobile">3</span>)</a>
  </div>

  <div class="main">
    <div class="order-tracking js-order-tracking">
      <!-- <a class="back-to-orders-link link-primary" href="orders.html">
        View all orders
      </a> -->
    </div>
  </div>
  <script src="data/tracking.js" type="module"></script>
</body>

</html>
