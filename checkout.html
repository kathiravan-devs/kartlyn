<!DOCTYPE html>
<html>

<head>
  <title>KartLyn Checkout</title>
  <link rel="icon" type="image/webp" href="images/Kartlyn-mobile.webp">

  <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Load a font called Roboto from Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Here are the CSS files for this page. -->
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
</head>

<body>
  <div class="checkout-header">
    <div class="header-content">
      <div class="checkout-header-left-section">
        <a href="index.html">
          <img class="kartlyn-logo" src="images/Kartlyn.PNG">
          <img class="kartlyn-mobile-logo" src="images/Kartlyn-mobile.webp">
        </a>
      </div>

      <div class="checkout-header-middle-section js-checkout-header-middle-section">
        Checkout (<a class="return-to-home-link" href="index.html">3 items</a>)
      </div>

      <div class="checkout-header-right-section">
        <img src="images/icons/checkout-lock-icon.png">
      </div>
    </div>
  </div>

  <div class="main">
    <div class="page-title">Review your order</div>

    <div class="checkout-grid">
      <div class="order-summary js-order-summary">

      </div>

      <div class="payment-summary js-payment-summary">
       
      </div>
    </div>
    <div class="cart-empty">
      <p>Your KartLyn cart is empty !!!</p>
      <button onclick= "window.location.href = 'index.html'">View Products</button>
    </div>
  </div>

  <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
  <script type="module" src="scripts/checkout.js"></script>

</body>

</html>
